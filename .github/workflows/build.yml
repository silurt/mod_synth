name: Build on Ubuntu

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Install PortAudio
      run: |
        sudo apt-get update
        sudo apt-get install -y portaudio19-dev
        # Move PortAudio to /opt/homebrew/lib
        sudo mv /usr/lib/x86_64-linux-gnu/libportaudio* /opt/homebrew/lib/

    - name: Build project
      run: make

    - name: Clean up
      run: make clean
