name: Build on Ubuntu

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Install PortAudio
      run: |
        sudo apt-get update
        sudo apt-get install -y portaudio19-dev

    - name: Build project
      run: make

    - name: Clean up
      run: make clean
