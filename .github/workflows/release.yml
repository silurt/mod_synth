name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Install PortAudio
      run: |
        sudo apt-get update
        sudo apt-get install -y portaudio19-dev
        # Move PortAudio to /opt/homebrew/lib
        sudo mv /usr/lib/x86_64-linux-gnu/libportaudio* /opt/homebrew/lib/

    - name: Build project
      run: make

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          bin/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
